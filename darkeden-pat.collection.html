let collections = [];

//document.getElementById("today").textContent = new Date().toISOString().slice(0, 10);

function parseData(txt) {
  collections = [];
  const lines = txt.trim().split(/\r?\n/);
  let cur = null;
  
  for (let i = 1; i < lines.length; i++) {
    const c = lines[i].split("\t");
    while (c.length < 4) c.push("");
    
    const num = c[0].trim();
    const name = c[1].trim();
    
    if (num || name) {
      cur = { id: num, name: name, pets: [], effects: [] };
      collections.push(cur);
    }
    if (!cur) continue;
    if (c[2].trim()) cur.pets.push(c[2].trim());
    if (c[3].trim()) cur.effects.push(c[3].trim());
  }
  
  for (let i = 1; i < collections.length; i++) {
    if (!collections[i].id) {
      collections[i].id = collections[i - 1].id;
    }
  }

  buildSelectors();
}

function cleanPetName(v) {
  return v.replace(/^★\d+\s*\([^)]+\)\s*/, '').trim();
}

function buildSelectors() {
  const petSet = new Set();
  collections.forEach(c => {
    c.pets.forEach(p => {
      const pureName = cleanPetName(p);
      if (pureName.includes(' / ')) {
        pureName.split(' / ').forEach(sp => petSet.add(sp.trim()));
      } else {
        petSet.add(pureName);
      }
    });
  });
  const pets = [...petSet].sort();

  const effectSet = new Set();
  collections.forEach(c => {
    const combinedEffect = c.effects.filter(e => e.trim()).join(", ");
    if (combinedEffect) effectSet.add(combinedEffect);
  });
  const effects = [...effectSet].sort();

  fill("petSelect", pets);
  fill("effectSelect", effects);
}

function fill(id, data) {
  const s = document.getElementById(id);
  s.innerHTML = '<option value="">선택</option>';
  data.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    s.appendChild(o);
  });
}

function getMultiLineHtml(arr) {
  return arr.map(item => `<span class="line-item">${item || '&nbsp;'}</span>`).join("");
}

function searchPet() {
  const selectedPet = document.getElementById("petSelect").value;
  if (!selectedPet) { document.getElementById("result").innerHTML = "펫을 선택해 주세요."; return; }
  
  let h = `<table class="result-table">
            <thead>
              <tr>
                <th style="width: 25%;">컬렉션명</th>
                <th style="width: 45%;">필요한 펫</th>
                <th style="width: 30%;">효과</th>
              </tr>
            </thead>
            <tbody>`;
            
  let count = 0;
  collections.filter(c => c.pets.some(p => cleanPetName(p).includes(selectedPet))).forEach(c => {
    count++;
    h += `<tr>
      <td><span class="result-title">${c.id}. ${c.name}</span></td>
      <td>${getMultiLineHtml(c.pets)}</td>
      <td>${getMultiLineHtml(c.effects)}</td>
    </tr>`;
  });
  
  h += `</tbody></table>`;
  document.getElementById("result").innerHTML = count > 0 ? h : "검색 결과가 없습니다.";
}

function searchEffect() {
  const selectedEffect = document.getElementById("effectSelect").value;
  if (!selectedEffect) { document.getElementById("result").innerHTML = "효과를 선택해 주세요."; return; }
  
  let h = `<table class="result-table">
            <thead>
              <tr>
                <th style="width: 25%;">컬렉션명</th>
                <th style="width: 45%;">필요한 펫</th>
                <th style="width: 30%;">효과</th>
              </tr>
            </thead>
            <tbody>`;
            
  let count = 0;
  collections.filter(c => c.effects.filter(x => x.trim()).join(", ") === selectedEffect).forEach(c => {
    count++;
    h += `<tr>
      <td><span class="result-title">${c.id}. ${c.name}</span></td>
      <td>${getMultiLineHtml(c.pets)}</td>
      <td>${getMultiLineHtml(c.effects)}</td>
    </tr>`;
  });
  
  h += `</tbody></table>`;
  document.getElementById("result").innerHTML = count > 0 ? h : "검색 결과가 없습니다.";
}

// 파일 선택 기능 대신 구현된 수동 텍스트 주입/교체 함수
function replaceData() {
  const txt = document.getElementById("dataTextArea").value.trim();
  if (!txt) {
    alert("교체할 텍스트 데이터를 입력창에 입력해 주세요.");
    return;
  }
  
  // 데이터 교체 프로세스 시작
  parseData(txt);
  
  // 상태 변경 알림 업데이트 및 결과 화면 초기화
  document.getElementById("dataSource").textContent = "사용자 지정 데이터로 교체됨";
  document.getElementById("dataSource").style.color = "blue";
  document.getElementById("result").innerHTML = "";
  alert("데이터가 새것으로 교체되었으며 펫 및 효과 목록이 업데이트되었습니다.");
}
